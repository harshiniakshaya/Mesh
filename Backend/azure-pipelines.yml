trigger:
  branches:
    include:
      - feature/backend/login-signup-api-1

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrLoginServer: 'meshappregistry.azurecr.io'
  acrServiceConnection: 'acr-connection'
  imageName: 'mesh-monolithic-app'
  imageTag: '$(Build.BuildId)'

stages:
  - stage: BuildAndPush
    displayName: 'Build and Push Docker Image'
    jobs:
      - job: Build
        displayName: 'Build and Push to ACR'
        steps:
          - task: Docker@2
            displayName: 'Build and Push'
            inputs:
              command: 'buildAndPush'
              # This path should be correct now
              dockerfile: '$(Build.SourcesDirectory)/Backend/Dockerfile'
              containerRegistry: $(acrServiceConnection)
              repository: $(imageName)
              tags: |
                $(imageTag)
                latest